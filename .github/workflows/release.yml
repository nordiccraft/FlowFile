name: Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Casks/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FlowFile (macOS 26)
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build signed app bundle, APFS DMG & SHA-256 checksums
        env:
          PUBLISH_GITHUB: "0"
          FLOWFILE_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")"
            VERSION="${LATEST_TAG#v}"
          fi
          chmod +x scripts/build-app.sh scripts/build-installer.sh scripts/release.sh scripts/update-cask.py
          ./scripts/release.sh "${VERSION}" "Bygget automatisk og verifiserbart fra åpen kildekode via GitHub Actions."
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release & Update Homebrew Cask on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_DIR="build/releases/v${RELEASE_VERSION}"
          ZIP_SHA256="$(shasum -a 256 "${REL_DIR}/FlowFile-Update.zip" | awk '{print $1}')"
          NOTES_FILE="${REL_DIR}/NOTES.md"

          cat > "${NOTES_FILE}" <<EOF
          ### FlowFile ${RELEASE_VERSION} for macOS 26

          Bygget direkte fra åpen Swift-kildekode på GitHub Actions (\`macos-26\`).

          #### Sømløs installasjon med Homebrew (uten Gatekeeper-advarsel)
          \`\`\`zsh
          brew tap nordiccraft/flowfile https://github.com/${GITHUB_REPOSITORY}
          brew install --cask flowfile
          \`\`\`

          #### Manuell installasjon med \`.dmg\`
          Last ned \`FlowFile-${RELEASE_VERSION}-Installer.dmg\`, dra \`FlowFile.app\` til \`Applications\`, og godkjenn første gang under *System Settings → Privacy & Security → Open Anyway*.

          #### SHA-256 sjekksummer
          \`\`\`
          $(cat "${REL_DIR}/SHA256SUMS.txt")
          \`\`\`
          EOF

          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" \
              "${REL_DIR}/FlowFile-${RELEASE_VERSION}-Installer.dmg" \
              "${REL_DIR}/FlowFile-Update.zip" \
              "${REL_DIR}/SHA256SUMS.txt" \
              --clobber
            gh release edit "v${RELEASE_VERSION}" --title "FlowFile ${RELEASE_VERSION}" --notes-file "${NOTES_FILE}"
          else
            gh release create "v${RELEASE_VERSION}" \
              "${REL_DIR}/FlowFile-${RELEASE_VERSION}-Installer.dmg" \
              "${REL_DIR}/FlowFile-Update.zip" \
              "${REL_DIR}/SHA256SUMS.txt" \
              --title "FlowFile ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

          # Update version & sha256 in-place inside Casks/flowfile.rb without overwriting manual cask edits
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update-cask.py Casks/flowfile.rb "${RELEASE_VERSION}" "${ZIP_SHA256}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flowfile.rb
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater Homebrew Cask til v${RELEASE_VERSION}"
            git push origin main
          fi
