name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FlowFile (macOS 26)
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build signed app bundle, DMG & SHA-256 checksums
        env:
          PUBLISH_GITHUB: "0"
          FLOWFILE_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.1"
          fi
          chmod +x scripts/build-app.sh scripts/build-installer.sh scripts/release.sh
          ./scripts/release.sh "${VERSION}" "Bygget automatisk og verifiserbart fra åpen kildekode via GitHub Actions."
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_DIR="build/releases/v${RELEASE_VERSION}"
          NOTES_FILE="${REL_DIR}/NOTES.md"
          cat > "${NOTES_FILE}" <<EOF
          ### FlowFile ${RELEASE_VERSION} for macOS 26

          Bygget direkte fra åpen Swift-kildekode på GitHub Actions (\`macos-26\`).

          - **Installer:** Last ned \`FlowFile-${RELEASE_VERSION}-Installer.dmg\` og dra \`FlowFile.app\` til \`Applications\`.
          - **Verifisering:** Kontroller sjekksummer i \`SHA256SUMS.txt\` og se full offentlig byggelogg under [Actions](https://github.com/${GITHUB_REPOSITORY}/actions).

          \`\`\`
          $(cat "${REL_DIR}/SHA256SUMS.txt")
          \`\`\`
          EOF

          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" \
              "${REL_DIR}/FlowFile-${RELEASE_VERSION}-Installer.dmg" \
              "${REL_DIR}/FlowFile-Update.zip" \
              "${REL_DIR}/SHA256SUMS.txt" \
              --clobber
            gh release edit "v${RELEASE_VERSION}" --title "FlowFile ${RELEASE_VERSION}" --notes-file "${NOTES_FILE}"
          else
            gh release create "v${RELEASE_VERSION}" \
              "${REL_DIR}/FlowFile-${RELEASE_VERSION}-Installer.dmg" \
              "${REL_DIR}/FlowFile-Update.zip" \
              "${REL_DIR}/SHA256SUMS.txt" \
              --title "FlowFile ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi
